# COBBS Intelligence — local development stack
# Usage: docker compose -f infra/docker-compose.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cobbs-postgres
    environment:
      POSTGRES_USER: cobbs
      POSTGRES_PASSWORD: cobbs
      POSTGRES_DB: cobbs
    ports:
      - "5432:5432"
    volumes:
      - cobbs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobbs -d cobbs"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cobbs-redis
    ports:
      - "6379:6379"
    volumes:
      - cobbs_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  cobbs_pgdata:
  cobbs_redis:
